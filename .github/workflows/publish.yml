name: publish

# Workflow versions published from the admin editor or the Claude connector
# arrive as pull requests from publish/* branches. This runs the same checks
# as `npm run verify`, queues GitHub auto-merge (main requires the `verify`
# check), waits for the merge, then waits until the live
# site reports the merged commit (verify-live). If the checks fail, the PR
# stays open and the admin change log shows "Not published".

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-and-merge:
    if: startsWith(github.head_ref, 'publish/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run verify
      - name: Merge the publish (once the required verify check passes)
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR" --squash --auto --repo "$REPO"
          for i in $(seq 1 60); do
            state=$(gh pr view "$PR" --repo "$REPO" --json state -q .state)
            if [ "$state" = "MERGED" ]; then break; fi
            if [ "$state" = "CLOSED" ]; then echo "PR was closed"; exit 1; fi
            sleep 15
          done
          sha=$(gh pr view "$PR" --repo "$REPO" --json mergeCommit -q .mergeCommit.oid)
          [ -n "$sha" ] || { echo "Not merged within 15 minutes"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          gh api -X DELETE "repos/$REPO/git/refs/heads/${{ github.head_ref }}" || true
      - name: Close the PR if the checks failed
        if: failure() && steps.merge.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr close "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --comment "The checks didn't pass, so this version wasn't published. Fix the draft in the editor and publish again." || true
      - name: Verify live
        env:
          SITE: https://vision360.agenticarc.ai
        run: node scripts/verify-live.mjs "$SITE" "${{ steps.merge.outputs.sha }}"
