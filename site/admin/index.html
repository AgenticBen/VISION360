<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Dashboard — VISION360 admin</title>
<link rel="icon" type="image/png" href="/brand/favicon.png">
<link rel="stylesheet" href="/brand/brand.css">
<link rel="stylesheet" href="/admin/admin.css">
<link rel="stylesheet" href="/whats-new.css">
</head>
<body class="admin">
<div class="admin-layout">
<main class="admin-main" id="main">
<header class="page-head">
  <div>
    <p class="eyebrow">Overview</p>
    <h1>Dashboard</h1>
    <p class="sub">What has happened in the last 30 days.</p>
  </div>
  <div class="page-actions"><span class="hint" id="updated"></span></div>
</header>
<p class="note" id="open-note" hidden>No password is needed for now: anyone with the link can open the admin pages. Email addresses are partly hidden while that's the case.</p>
<section data-tour="needs" class="card" style="margin-top:14px"><h2>Needs you</h2><div class="needs" id="needs"><span class="hint">Loading…</span></div></section>
<section data-tour="stats" style="margin-top:14px"><div class="grid stats" id="stats"></div></section>
<div class="two-col">
  <section class="card" data-tour="per-day"><h2>Conversations per day</h2><div class="table-wrap"><table class="t" id="per-day"><thead><tr><th>Day</th><th class="n">Conversations</th><th></th></tr></thead><tbody></tbody></table></div><p class="hint" id="storage-note"></p></section>
  <section class="card" data-tour="recent-changes"><h2>Recent changes</h2><ul class="timeline" id="recent"></ul><p><a href="/admin/changelog/">Full change log →</a></p></section>
</div>
</main>
</div>
<script src="/admin/shell.js"></script>
<script src="/admin/dashboard.js"></script>
<script src="/request-button.js"></script>
<script src="/whats-new.js" data-page="admin-dashboard" defer></script>
</body>
</html>
